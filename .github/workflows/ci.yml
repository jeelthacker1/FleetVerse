name: FleetVerse verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.lock
      - run: ruff check backend
      - run: pytest -q -s
        working-directory: backend
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run build
        working-directory: web
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: docker compose up --build -d --wait
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: web
      - if: always()
        run: docker compose logs > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: |
            compose.log
            web/playwright-report
